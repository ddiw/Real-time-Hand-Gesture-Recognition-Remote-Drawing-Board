<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>원격 손 제스처 그림판</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2ff;font:14px/1.5 system-ui,sans-serif}
header{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid #29314d}
#dot{width:11px;height:11px;border-radius:50%;background:#ef5350}#dot.on{background:#42d392}#status{margin-left:auto;color:#9da8c7}
.wrap{padding:18px}.views{display:grid;grid-template-columns:1fr minmax(280px,480px);gap:18px}
.card{background:#151c31;border:1px solid #29314d;border-radius:12px;padding:14px}
.card h3{margin:0 0 10px;font-size:14px}
.stage{background:#05070e;min-height:360px;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden}
.frame{position:relative;display:inline-block;line-height:0}.frame img{display:block;max-width:100%;max-height:72vh}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.placeholder{color:#6f7a9b}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools button{padding:9px 14px;border:0;border-radius:8px;background:#28345a;color:#dce4ff;font-weight:600;cursor:pointer}
.tools button:hover{background:#33427088}.tools button.primary{background:#4f7cff;color:#fff}.tools button:disabled{opacity:.4;cursor:default}
.swatches{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.swatches span{color:#8792b2;font-size:11px;margin-right:2px}
.swatches button{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid #29314d;cursor:pointer}
.swatches button[aria-pressed="true"]{border-color:#edf2ff;box-shadow:0 0 0 2px #4f7cff}
.panel{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-top:18px}
.qr img{width:190px;background:white;padding:8px;border-radius:8px}.qr a{display:block;color:#79a8ff;word-break:break-all;font-size:11px}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.metric{background:#0b1020;border-radius:8px;padding:12px}.metric span{display:block;color:#8792b2;font-size:11px}.metric b{font-size:20px}
.guide{margin:12px 0 0;padding:0;list-style:none;display:flex;gap:16px;flex-wrap:wrap;color:#9da8c7;font-size:12px}.guide b{color:#65e6ad}
.gallery{margin-top:18px}.shots{display:flex;gap:10px;flex-wrap:wrap}
.shots a{display:block;border:1px solid #29314d;border-radius:8px;overflow:hidden;background:#fff}
.shots img{display:block;width:88px;height:auto}
.empty{color:#6f7a9b;font-size:12px}
@media(max-width:850px){.views,.panel{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><span id="dot"></span><strong>원격 손 제스처 그림판</strong><span id="status">연결 준비 중</span></header><main class="wrap">
<div class="views">
<section class="card"><h3>휴대폰 원본 + 추론 결과</h3><div class="stage"><span id="sourceEmpty" class="placeholder">카메라 대기 중</span><div class="frame" id="sourceFrame" hidden><img id="source" alt="휴대폰 원본"><canvas id="overlay" width="640" height="480"></canvas></div></div></section>
<section class="card"><h3>OpenCV 캔버스</h3>
<div class="tools"><button id="zoomIn">확대 +</button><button id="zoomOut">축소 −</button><button id="clear">초기화</button><button id="save" class="primary">PNG 저장</button></div>
<div class="swatches" id="swatches"><span>펜 색상</span></div>
<div class="stage"><span id="canvasEmpty" class="placeholder">그림판 대기 중</span><img id="canvas" alt="캔버스" hidden style="max-width:100%;max-height:72vh;display:block"></div></section>
</div>
<div class="panel"><section class="card qr"><h3>휴대폰 연결</h3><div id="qr">주소 준비 중</div></section>
<section class="card"><h3>실시간 상태</h3><div class="metrics">
<div class="metric"><span>명령</span><b id="command">IDLE</b></div>
<div class="metric"><span>모드</span><b id="mode">IDLE</b></div>
<div class="metric"><span>손가락</span><b id="fingers">–</b></div>
<div class="metric"><span>줌</span><b id="zoom">1.00×</b></div>
<div class="metric"><span>지연 (A→B→C→캔버스)</span><b id="infer">– ms</b></div>
<div class="metric"><span>수신 FPS</span><b id="fps">0.0</b></div>
</div>
<ul class="guide"><li><b>1개</b> 그리기</li><li><b>2개</b> 지우기</li><li><b>3개</b> 좌 이동 확대 / 우 이동 축소</li><li><b>주먹</b> 초기화</li></ul>
</section></div>
<section class="card gallery"><h3>저장한 그림</h3><div class="shots" id="shots"></div><p class="empty" id="shotsEmpty">아직 저장한 그림이 없습니다.</p></section>
</main><script>
const $=s=>document.querySelector(s);
const HAND=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const TIPS=new Set([4,8,12,16,20]);
let ws,retry,token='',recent=[],marks=null,lastSaved='';
const octx=$('#overlay').getContext('2d');
function unpack(buf){const n=new DataView(buf).getUint32(0,false),meta=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,4,n)));return{meta,image:new Uint8Array(buf,4+n)}}
function showImage(img,bytes){const url=URL.createObjectURL(new Blob([bytes],{type:'image/jpeg'})),old=img.src;img.onload=()=>old&&URL.revokeObjectURL(old);img.src=url}
function drawOverlay(){const c=$('#overlay'),w=c.width,h=c.height;octx.clearRect(0,0,w,h);
  if(!marks||marks.length!==21)return;
  const p=marks.map(m=>[m.x*w,m.y*h]);
  octx.lineWidth=3;octx.strokeStyle='rgba(80,210,80,.95)';octx.beginPath();
  for(const [a,b] of HAND){octx.moveTo(p[a][0],p[a][1]);octx.lineTo(p[b][0],p[b][1])}octx.stroke();
  for(let i=0;i<21;i++){octx.beginPath();octx.arc(p[i][0],p[i][1],TIPS.has(i)?5:3.5,0,6.284);octx.fillStyle=TIPS.has(i)?'#ffb01e':'#00c8ff';octx.fill()}}
function addShot(item,front){const a=document.createElement('a');a.href=item.url;a.download=item.name;a.title=item.name;a.target='_blank';a.rel='noopener';
  const img=document.createElement('img');img.src=item.url;img.alt=item.name;a.appendChild(img);
  front?$('#shots').prepend(a):$('#shots').appendChild(a);$('#shotsEmpty').hidden=true}
function act(action,value){if(ws&&ws.readyState===1)ws.send(JSON.stringify({action,value}))}
const PENS=[['먹','#141414'],['빨강','#e53935'],['주황','#fb8c00'],['초록','#2e7d32'],['파랑','#1e6fe8'],['보라','#8e24aa']];
function buildSwatches(){const bar=$('#swatches');
  for(const [name,hex] of PENS){const b=document.createElement('button');
    b.type='button';b.title=name;b.setAttribute('aria-label','펜 색상 '+name);b.dataset.hex=hex;
    b.style.background=hex;b.setAttribute('aria-pressed',String(hex===PENS[0][1]));
    b.onclick=()=>{act('color',hex);markSwatch(hex)};bar.appendChild(b)}}
function markSwatch(hex){for(const b of $('#swatches').querySelectorAll('button'))
  b.setAttribute('aria-pressed',String(b.dataset.hex.toLowerCase()===hex.toLowerCase()))}
function hexFromBgr(c){return Array.isArray(c)&&c.length===3
  ?'#'+[c[2],c[1],c[0]].map(v=>Number(v).toString(16).padStart(2,'0')).join(''):null}
function connect(){clearTimeout(retry);ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/monitor?t='+encodeURIComponent(token));ws.binaryType='arraybuffer';
  ws.onopen=()=>{$('#dot').classList.add('on');$('#status').textContent='모니터 연결됨'};
  ws.onmessage=e=>{if(typeof e.data==='string')return;const f=unpack(e.data);
    if(f.meta.kind==='saved'){
      if(f.meta.name===lastSaved)return;lastSaved=f.meta.name;addShot(f.meta,true);
      const a=document.createElement('a');a.href=f.meta.url;a.download=f.meta.name;document.body.appendChild(a);a.click();a.remove();
      $('#status').textContent='저장됨: '+f.meta.name;return}
    if(f.meta.kind==='source'){showImage($('#source'),f.image);$('#sourceFrame').hidden=false;$('#sourceEmpty').hidden=true;
      const now=performance.now();recent.push(now);if(recent.length>30)recent.shift();
      $('#fps').textContent=(recent.length>2?(recent.length-1)/((recent.at(-1)-recent[0])/1000):0).toFixed(1);return}
    // Canvas frames are the only ones carrying command state; source frames
    // must never overwrite it with undefined.
    showImage($('#canvas'),f.image);$('#canvas').hidden=false;$('#canvasEmpty').hidden=true;
    marks=f.meta.landmarks||null;drawOverlay();
    $('#command').textContent=f.meta.command??'IDLE';$('#mode').textContent=f.meta.mode??'IDLE';
    $('#fingers').textContent=f.meta.finger_count??'–';
    // The canvas is the authority on the active colour; follow it so a second
    // monitor viewer sees the same swatch selected.
    const pen=hexFromBgr(f.meta.pen_color);if(pen)markSwatch(pen);
    $('#zoom').textContent=Number(f.meta.zoom||1).toFixed(2)+'×';
    // pipeline_ms is measured end to end on A's clock. inference_ms subtracts
    // the phone's clock from the PC's, so it carries their skew and is only a
    // fallback when A could not pair the seq.
    $('#infer').textContent=f.meta.pipeline_ms!=null
      ?Number(f.meta.pipeline_ms).toFixed(0)+' ms'
      :Number(f.meta.inference_ms||0).toFixed(0)+' ms?'};
  ws.onclose=()=>{$('#dot').classList.remove('on');$('#status').textContent='재연결 중';retry=setTimeout(connect,2000)}}
async function init(){const c=await fetch('/api/config').then(r=>r.json());token=c.session_token;
  const base=(c.public_base_url||location.origin).replace(/\/$/,'');const url=base+'/capture.html?t='+encodeURIComponent(token);
  $('#qr').innerHTML=`<img alt="휴대폰 접속 QR" src="/qr?u=${encodeURIComponent(url)}"><a href="${url}" target="_blank" rel="noopener">${url}</a>`;
  $('#zoomIn').onclick=()=>act('zoom_in');$('#zoomOut').onclick=()=>act('zoom_out');
  $('#clear').onclick=()=>act('clear');$('#save').onclick=()=>act('save');buildSwatches();
  try{const saved=await fetch('/api/drawings').then(r=>r.json());saved.forEach(item=>addShot(item,false));if(saved[0])lastSaved=saved[0].name}catch(e){}
  connect()}
init();
</script></body></html>
