<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>원격 손 제스처 그림판</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2ff;font:14px/1.5 system-ui,sans-serif}header{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid #29314d}#dot{width:11px;height:11px;border-radius:50%;background:#ef5350}#dot.on{background:#42d392}#status{margin-left:auto;color:#9da8c7}.wrap{padding:18px}.views{display:grid;grid-template-columns:1fr minmax(280px,480px);gap:18px}.card{background:#151c31;border:1px solid #29314d;border-radius:12px;padding:14px}.stage{background:#05070e;min-height:360px;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden}.stage img{display:block;max-width:100%;max-height:72vh}.placeholder{color:#6f7a9b}.panel{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-top:18px}.qr img{width:190px;background:white;padding:8px;border-radius:8px}.qr a{display:block;color:#79a8ff;word-break:break-all;font-size:11px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.metric{background:#0b1020;border-radius:8px;padding:12px}.metric span{display:block;color:#8792b2;font-size:11px}.metric b{font-size:20px}@media(max-width:850px){.views,.panel{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><span id="dot"></span><strong>원격 손 제스처 그림판</strong><span id="status">연결 준비 중</span></header><main class="wrap">
<div class="views"><section class="card"><h3>휴대폰 원본 + 측정 영역</h3><div class="stage"><span id="sourceEmpty" class="placeholder">카메라 대기 중</span><img id="source" hidden></div></section><section class="card"><h3>OpenCV 캔버스</h3><div class="stage"><span id="canvasEmpty" class="placeholder">그림판 대기 중</span><img id="canvas" hidden></div></section></div>
<div class="panel"><section class="card qr"><h3>휴대폰 연결</h3><div id="qr">주소 준비 중</div></section><section class="card"><h3>실시간 상태</h3><div class="metrics"><div class="metric"><span>명령</span><b id="command">IDLE</b></div><div class="metric"><span>모드</span><b id="mode">IDLE</b></div><div class="metric"><span>줌</span><b id="zoom">1.00×</b></div><div class="metric"><span>추론</span><b id="infer">– ms</b></div><div class="metric"><span>수신 FPS</span><b id="fps">0.0</b></div></div></section></div>
</main><script>
const $=s=>document.querySelector(s);let ws,retry,token='',recent=[];
function unpack(buf){const n=new DataView(buf).getUint32(0,false),meta=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,4,n)));return{meta,image:new Uint8Array(buf,4+n)}}
function showImage(id,empty,bytes){const img=$(id),url=URL.createObjectURL(new Blob([bytes],{type:'image/jpeg'})),old=img.src;img.onload=()=>old&&URL.revokeObjectURL(old);img.src=url;img.hidden=false;$(empty).hidden=true}
function connect(){clearTimeout(retry);ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/monitor?t='+encodeURIComponent(token));ws.binaryType='arraybuffer';ws.onopen=()=>{$('#dot').classList.add('on');$('#status').textContent='모니터 연결됨'};ws.onmessage=e=>{if(typeof e.data==='string')return;const f=unpack(e.data);if(f.meta.kind==='source')showImage('#source','#sourceEmpty',f.image);else showImage('#canvas','#canvasEmpty',f.image);$('#command').textContent=f.meta.command;$('#mode').textContent=f.meta.mode;$('#zoom').textContent=Number(f.meta.zoom).toFixed(2)+'×';$('#infer').textContent=Number(f.meta.inference_ms).toFixed(1)+' ms';const now=performance.now();recent.push(now);if(recent.length>30)recent.shift();$('#fps').textContent=(recent.length>2?(recent.length-1)/((recent.at(-1)-recent[0])/1000)/2:0).toFixed(1)};ws.onclose=()=>{$('#dot').classList.remove('on');$('#status').textContent='재연결 중';retry=setTimeout(connect,2000)}}
async function init(){const c=await fetch('/api/config').then(r=>r.json());token=c.session_token;const base=c.public_base_url||location.origin,url=base+'/capture.html?t='+encodeURIComponent(token);$('#qr').innerHTML=`<img alt="휴대폰 접속 QR" src="/qr?u=${encodeURIComponent(url)}"><a href="${url}" target="_blank">${url}</a>`;connect()}init();
</script></body></html>
